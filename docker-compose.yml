services:
  maven:
    image: maven:3.9-eclipse-temurin-25
    user: "$DEFAULT_DOCKER_USER"
    working_dir: /usr/src/maven
    volumes:
      - ./:/usr/src/maven
      - ~/.m2:/var/maven/.m2
    environment:
      MAVEN_CONFIG: /var/maven/.m2

  node:
    # image Debian (et non alpine) : yarn installe entcore-generic-icons depuis git, que
    # node:26-alpine n'a pas (et build.sh tourne sans root, pas d'apk add possible).
    image: node:26
    working_dir: /home/node/app
    volumes:
      - ./:/home/node/app
      - ../../common:/home/node/app/common
      - ~/.npm:/.npm